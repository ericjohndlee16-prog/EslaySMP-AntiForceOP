
name: Build EslaySMP AntiForceOP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract plugin source
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir plugin
          unzip -q "$ZIP" -d plugin

      - name: Build plugin
        run: gradle -p plugin build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EslaySMP-AntiForceOP
          path: plugin/build/libs/*.jar
